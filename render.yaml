services:
  - type: web
    name: mediguide-ai
    runtime: python
    plan: free
    buildCommand: pip install -r python_backend/requirements.txt
    startCommand: python -c "from alembic.config import Config; from alembic import command; config = Config(); config.set_main_option('script_location', 'python_backend/migrations'); command.upgrade(config, 'head')" && uvicorn python_backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: MEDIGUIDE_SECRET
        generateValue: true
      - key: APP_BASE_URL
        value: https://mediguide-ai.onrender.com
      - key: OLADOC_SUBMIT_MODE
        value: disabled
