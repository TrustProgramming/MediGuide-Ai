services:
  - type: web
    name: mediguide-ai
    runtime: python
    plan: starter
    buildCommand: pip install -r python_backend/requirements.txt
    preDeployCommand: python -c "from alembic.config import Config; from alembic import command; config = Config(); config.set_main_option('script_location', 'python_backend/migrations'); command.upgrade(config, 'head')"
    startCommand: uvicorn python_backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: mediguide-data
      mountPath: /opt/render/project/src/python_backend/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: MEDIGUIDE_SECRET
        generateValue: true
      - key: APP_BASE_URL
        value: https://mediguide-ai.onrender.com
      - key: OLADOC_SUBMIT_MODE
        value: disabled
